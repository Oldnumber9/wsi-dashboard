name: Publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
# GitHub's artifact listing lags right after an upload: deploy-pages sometimes
# reports "No artifacts named github-pages were found" for a bundle uploaded
# seconds earlier (~19% of runs, Nov 2026), while older bundles are visible.
# So: upload ONCE, wait 15s, deploy; on failure wait 30/60/120s and deploy the
# SAME bundle again (re-uploading restarts the lag). Only a 4th straight
# failure fails the run and sends an email.
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url || steps.d4.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: . }
      - run: sleep 15

      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.d1.outcome == 'failure'
        run: sleep 30
      - id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.d2.outcome == 'failure'
        run: sleep 60
      - id: d3
        if: steps.d2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - if: steps.d3.outcome == 'failure'
        run: sleep 120
      - id: d4
        if: steps.d3.outcome == 'failure'
        uses: actions/deploy-pages@v5
